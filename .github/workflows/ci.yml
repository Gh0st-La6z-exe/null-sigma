name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Treat all compiler warnings as errors — same strictness as local `cargo clippy -W clippy::pedantic`.
  RUSTFLAGS: -D warnings

jobs:
  # ─── Test matrix: stable + MSRV ───────────────────────────────────────────
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - "1.85"   # MSRV: first stable Rust with edition 2024 support (required by indexmap ≥ 2.14)
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test

  # ─── Lint ─────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy -- -W clippy::all -W clippy::pedantic

  # ─── Format ───────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt -- --check

  # ─── Docs ─────────────────────────────────────────────────────────────────
  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo doc
        run: cargo doc --no-deps
        env:
          # Broken intra-doc links and missing docs are errors, not warnings.
          RUSTDOCFLAGS: -D warnings

  # ─── Security audit ───────────────────────────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        # Deny advisories of any severity. The advisory database is fetched
        # fresh on every run so new CVEs are caught on the next push.
        run: cargo audit --deny warnings

  # ─── License and dependency policy ───────────────────────────────────────
  deny:
    name: Licenses & bans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo deny check
        # Enforces the license allow-list in deny.toml and bans re-introduction
        # of serde_yaml / serde_yml (replaced by serde_norway).
        run: cargo deny check
