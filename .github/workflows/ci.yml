name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly fuzz run — Sunday 02:00 UTC
    - cron: "0 2 * * 0"

env:
  CARGO_TERM_COLOR: always
  # Treat all compiler warnings as errors — same strictness as local `cargo clippy -W clippy::pedantic`.
  RUSTFLAGS: -D warnings

jobs:
  # ─── Test matrix: stable + MSRV ───────────────────────────────────────────
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - "1.85"   # MSRV: first stable Rust with edition 2024 support (required by indexmap ≥ 2.14)
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo test (default features)
        run: cargo test

      - name: cargo test (json feature)
        run: cargo test --features json

  # ─── Lint ─────────────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy (default features)
        run: cargo clippy -- -W clippy::all -W clippy::pedantic

      - name: cargo clippy (json feature)
        run: cargo clippy --features json -- -W clippy::all -W clippy::pedantic

  # ─── Format ───────────────────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt -- --check

  # ─── Docs ─────────────────────────────────────────────────────────────────
  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo doc
        run: cargo doc --no-deps --features json
        env:
          # Broken intra-doc links and missing docs are errors, not warnings.
          RUSTDOCFLAGS: -D warnings

  # ─── Security audit ───────────────────────────────────────────────────────
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        # Deny advisories of any severity. The advisory database is fetched
        # fresh on every run so new CVEs are caught on the next push.
        run: cargo audit --deny warnings

  # ─── License and dependency policy ───────────────────────────────────────
  deny:
    name: Licenses & bans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo deny check
        # Enforces the license allow-list in deny.toml and bans re-introduction
        # of serde_yaml / serde_yml (replaced by serde_norway).
        run: cargo deny check

  # ─── Fuzz build (every push) ─────────────────────────────────────────────
  fuzz-build:
    name: Fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build fuzz targets
        # Build without running — ensures fuzz targets always compile.
        # Catches API breakage between the engine and fuzz harnesses on every push.
        working-directory: fuzz
        run: cargo build --bins

  # ─── Fuzz run (weekly schedule only) ─────────────────────────────────────
  fuzz-run:
    name: Fuzz (${{ matrix.target }})
    # Only run on the weekly schedule — not on every push/PR.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_parse_rule
          - fuzz_evaluate_event
          - fuzz_flatten_json
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run fuzz target (${{ matrix.target }}) for 5 minutes
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
