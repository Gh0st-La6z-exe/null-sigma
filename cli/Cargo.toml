# =============================================================================
# null-sigma-cli — ROADMAP §4 product CLI (Week 2)
#
# Sibling package: consumes null-sigma[json] only. No competitor engines.
# Days 1–3 + §4b sequenced MT: trust ingest, lean NDJSON, ordered chunk pipeline.
# publish = false until crates.io release; install via `cargo install --path cli`.
# =============================================================================

[package]
name = "null-sigma-cli"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Sigma detection CLI — JSONL in, alerts out (null-sigma)"
repository = "https://github.com/Gh0st-La6z-exe/null-sigma"
readme = "README.md"
keywords = ["sigma", "detection", "siem", "cli"]
categories = ["command-line-utilities"]
# Tracks the library series; not published independently yet.
rust-version = "1.85"

# Standalone workspace root — keeps this crate out of any parent workspace.
[workspace]

[[bin]]
name = "null-sigma-cli"
path = "src/main.rs"

[dependencies]
null-sigma = { path = "..", features = ["json"] }
rayon = "1.10"
serde_json = "1.0"

[profile.release]
debug = false
