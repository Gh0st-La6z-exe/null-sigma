# =============================================================================
# NuLL Sigma Rule Engine — Compiled Detection at Scale
# =============================================================================

[package]
name = "null-sigma"
version.workspace = true
edition.workspace = true
authors = ["Gh0st-La6z-exe"]
license = "Apache-2.0"
description = "High-performance Sigma rule engine — compile detection rules to Aho-Corasick + regex AST, evaluate events at 455K+/sec per core against 1000 rules (Apple M4, release)"
repository = "https://github.com/Gh0st-La6z-exe/null-sigma"
readme = "README.md"
keywords = ["sigma", "detection", "siem", "security", "aho-corasick"]
categories = ["parsing", "algorithms"]
rust-version = "1.82"

[dependencies]
# YAML parsing — Sigma rules are YAML-based. serde_yaml is the standard
# Rust YAML parser with full serde integration.
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Aho-Corasick — SIMD-accelerated multi-pattern matching. When a Sigma rule
# has multiple string patterns (e.g., 10 suspicious process names), we build
# a single automaton that checks ALL patterns in one pass over the text.
# This is what makes 1000-rule evaluation fast — O(text_len) not O(patterns × text_len).
aho-corasick = "1.1"

# Regex for wildcard and regex modifiers in Sigma conditions.
# Sigma supports `|re` (regex) and `*` glob wildcards in values.
regex = "1.11"

[dev-dependencies]
criterion = { workspace = true }
# Generative property-based testing — generates thousands of random inputs to
# prove engine invariants hold universally, not just for hand-picked cases.
proptest = "1.5"

[[bench]]
name = "sigma_bench"
harness = false
