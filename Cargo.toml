# =============================================================================
# NuLL Sigma Rule Engine — Compiled Detection at Scale
# =============================================================================

[package]
name = "null-sigma"
version = "0.1.1"
edition = "2021"
authors = ["Gh0st-La6z-exe"]
license = "Apache-2.0"
description = "High-performance Sigma rule engine — Aho-Corasick prefilter + compiled condition AST; ~311k events/sec × 1k synthetic rules or ~1.9k/sec on real SigmaHQ process_creation rules (Apple M4, release)"
repository = "https://github.com/Gh0st-La6z-exe/null-sigma"
readme = "README.md"
keywords = ["sigma", "detection", "siem", "security", "aho-corasick"]
categories = ["parsing", "algorithms"]
rust-version = "1.85"

[dependencies]
# Serialisation framework — required by serde_norway and for deriving Serialize/Deserialize.
serde = { version = "1.0", features = ["derive"] }
# YAML parsing — serde_norway is the actively maintained, RustSec-recommended
# fork of serde_yaml (see RUSTSEC-2025-0068). Uses pure-Rust unsafe-libyaml-norway.
serde_norway = "0.9"

# Aho-Corasick — SIMD-accelerated multi-pattern matching. When a Sigma rule
# has multiple string patterns (e.g., 10 suspicious process names), we build
# a single automaton that checks ALL patterns in one pass over the text.
# This is what makes 1000-rule evaluation fast — O(text_len) not O(patterns × text_len).
aho-corasick = "1.1"

# Regex for wildcard and regex modifiers in Sigma conditions.
# Sigma supports `|re` (regex) and `*` glob wildcards in values.
regex = "1.11"

# JSON parsing for the optional `json` ingestion feature - flattens nested
# telemetry (ECS, Sysmon, CloudTrail) into the engine's flat event format.
serde_json = { version = "1.0", optional = true }

[features]
# Nested JSON event ingestion: `json::flatten_str`, `json::flatten_value`,
# and `SigmaEngine::evaluate_json`. Off by default — the core engine has no
# JSON dependency.
json = ["dep:serde_json"]

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
# Generative property-based testing — generates thousands of random inputs to
# prove engine invariants hold universally, not just for hand-picked cases.
proptest = "1.5"
# JSON construction in tests for the `json` feature (fixtures, property strategies).
serde_json = "1.0"

# docs.rs builds with all features so the `json` module appears in the docs.
[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "sigma_bench"
harness = false

[[bench]]
name = "json_bench"
harness = false
required-features = ["json"]
